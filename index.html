<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Seni Budaya</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            padding: 20px; 
            background-color: #f4f7f6; 
            max-width: 500px; 
            margin: auto; 
        }
        h1, h3 { 
            color: #2c3e50; 
            text-align: center; 
        }
        .input-group, .soal-card, .leaderboard-card, .selesai-card { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            margin-bottom: 20px; 
        }
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 10px; 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px;
        }
        .soal-card img { 
            width: 100%; 
            border-radius: 10px; 
            margin-top: 10px; 
            margin-bottom: 15px; 
            display: block; 
            object-fit: cover;
            max-height: 250px;
        }
        .soal-card label { 
            display: block; 
            padding: 10px;
            margin-bottom: 8px; 
            border: 2px solid #eee;
            border-radius: 8px;
            cursor: pointer; 
            font-size: 15px;
            transition: all 0.2s;
        }
        .soal-card label:hover {
            background-color: #f8f9fa;
            border-color: #cbd5e1;
        }
        .soal-card input[type="radio"] {
            margin-right: 10px;
        }
        button { 
            width: 100%; 
            padding: 15px; 
            background-color: #27ae60; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 18px; 
            cursor: pointer; 
            transition: background 0.3s;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { 
            background-color: #2ecc71; 
        }
        .hidden {
            display: none;
        }
        /* Style Tabel Leaderboard */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        th {
            color: #2c3e50;
        }
        /* Animasi Transisi Halus Estetik */
        @keyframes fadeInSlide { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .animasi-transisi { 
            animation: fadeInSlide 0.4s ease-in-out; 
        }
    </style>
</head>
<body>
    <h1>🎨 Kuis Seni Budaya</h1>
    
    <!-- Bagian Pendaftaran Nama & Kelas -->
    <div id="login-section" class="input-group animasi-transisi">
        <p style="margin-top:0; color:#555; text-align:center;">Masukkan identitas sebelum mulai:</p>
        <input type="text" id="nama" placeholder="Nama Lengkap" required>
        <input type="text" id="kelas" placeholder="Kelas" required>
        <button onclick="mulaiKuis()">Mulai Kuis 🚀</button>
    </div>

    <!-- Bagian Kuis (Tampil Satu per Satu) -->
    <div id="quiz-section" class="hidden">
        <div id="soal-container"></div>
        <button id="btn-lanjut" onclick="prosesJawaban()" class="hidden">Soal Berikutnya ➡️</button>
    </div>

    <!-- Bagian Hasil Akhir -->
    <div id="result-section" class="hidden selesai-card animasi-transisi" style="text-align: center;">
        <h2>🎉 Kuis Selesai!</h2>
        <p id="hasil-teks" style="font-size: 18px; margin: 20px 0;"></p>
    </div>

    <!-- Kartu Leaderboard -->
    <div class="leaderboard-card animasi-transisi">
        <h3>🏆 Peringkat Teratas</h3>
        <table>
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Kelas</th>
                    <th>Skor</th>
                </tr>
            </thead>
            <tbody id="isi-leaderboard">
                <tr><td colspan="3" style="text-align: center; color: #888;">Memuat peringkat...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
        const API_URL = 'https://script.google.com/macros/s/AKfycbwCQiAcQz_oGypiruMPdNnpBhcdjPbwADx_jHxBGxi8zFXJhzLzCs2tdyp1CucyNvEF/exec';
        let dataSoal = [];
        let indeksSoalAktif = 0;
        let jawabanSiswa = [];
        let namaSiswa = '';
        let kelasSiswa = '';

        // 1. Ambil Data Soal dari Google Sheets saat halaman dibuka
        fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                dataSoal = data;
            })
            .catch(error => {
                console.error("Gagal memuat soal", error);
            });

        // 2. Ambil Data Leaderboard
        function muatLeaderboard() {
            fetch(API_URL + '?mode=leaderboard')
                .then(res => res.json())
                .then(data => {
                    let rows = '';
                    if (data.length === 0) {
                        rows = '<tr><td colspan="3" style="text-align: center; color: #888;">Belum ada data skor.</td></tr>';
                    } else {
                        data.slice(0, 5).forEach(item => {
                            rows += `<tr><td>${item.nama}</td><td>${item.kelas}</td><td><strong>${item.skor}</strong></td></tr>`;
                        });
                    }
                    document.getElementById('isi-leaderboard').innerHTML = rows;
                });
        }
        muatLeaderboard();

        // 3. Mulai Kuis setelah mengisi nama & kelas
        function mulaiKuis() {
            namaSiswa = document.getElementById('nama').value.trim();
            kelasSiswa = document.getElementById('kelas').value.trim();

            if (!namaSiswa || !kelasSiswa) {
                alert("Harap isi Nama dan Kelas terlebih dahulu!");
                return;
            }

            if (dataSoal.length === 0) {
                alert("Soal sedang dimuat atau koneksi bermasalah. Coba muat ulang halaman.");
                return;
            }

            // Sembunyikan form login, tampilkan area kuis
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            
            tampilkanSoal(indeksSoalAktif);
        }

        // 4. Render Soal Satu per Satu dengan Animasi
        function tampilkanSoal(index) {
            const item = dataSoal[index];
            let imgTag = '';
            if (item.gambar && item.gambar.trim() !== '') {
                imgTag = `<img src="${item.gambar}" alt="Ilustrasi Soal">`;
            }

            let html = `
                <div class="soal-card animasi-transisi">
                    <p style="color: #666; font-size: 14px; margin-bottom: 5px;">Soal ${index + 1} dari ${dataSoal.length}</p>
                    <p><strong>${item.pertanyaan}</strong></p>
                    ${imgTag}
                    <label><input type="radio" name="pilihan" value="${item.opsi_a}" onclick="tampilkanTombolLanjut()"> ${item.opsi_a}</label>
                    <label><input type="radio" name="pilihan" value="${item.opsi_b}" onclick="tampilkanTombolLanjut()"> ${item.opsi_b}</label>
                    <label><input type="radio" name="pilihan" value="${item.opsi_c}" onclick="tampilkanTombolLanjut()"> ${item.opsi_c}</label>
                    <label><input type="radio" name="pilihan" value="${item.opsi_d}" onclick="tampilkanTombolLanjut()"> ${item.opsi_d}</label>
                </div>
            `;

            document.getElementById('soal-container').innerHTML = html;
            // Sembunyikan tombol lanjut sampai siswa memilih salah satu opsi
            document.getElementById('btn-lanjut').classList.add('hidden');
        }

        // Munculkan tombol lanjut begitu opsi diklik
        function tampilkanTombolLanjut() {
            document.getElementById('btn-lanjut').classList.remove('hidden');
        }

        // 5. Proses Jawaban & Pindah ke Soal Berikutnya / Selesai
        function prosesJawaban() {
            const pilihanDipilih = document.querySelector('input[name="pilihan"]:checked');
            if (!pilihanDipilih) {
                alert("Pilih salah satu jawaban terlebih dahulu!");
                return;
            }

            // Simpan jawaban siswa
            jawabanSiswa.push(pilihanDipilih.value.trim());

            indeksSoalAktif++;

            if (indeksSoalAktif < dataSoal.length) {
                // Lanjut ke soal berikutnya dengan animasi
                tampilkanSoal(indeksSoalAktif);
            } else {
                // Jika soal habis, hitung skor dan kirim ke server
                hitungDanKirimHasil();
            }
        }

        // 6. Hitung Skor & Kirim ke Google Sheets
        function hitungDanKirimHasil() {
            let totalBenar = 0;
            const poinPerSoal = 100 / dataSoal.length;

            dataSoal.forEach((item, index) => {
                if (jawabanSiswa[index] === item.kunci.trim()) {
                    totalBenar++;
                }
            });

            const skorAkhir = totalBenar * poinPerSoal;

            // Sembunyikan area kuis, tampilkan kartu selesai
            document.getElementById('quiz-section').classList.add('hidden');
            const resultSection = document.getElementById('result-section');
            resultSection.classList.remove('hidden');
            document.getElementById('hasil-teks').innerHTML = `Halo <strong>${namaSiswa}</strong> (${kelasSiswa}),<br> Skor akhir Anda adalah: <span style="font-size: 28px; color: #27ae60; font-weight: bold;">${skorAkhir}</span>`;

            // Kirim data ke Google Sheets
            const payload = {
                nama: namaSiswa,
                kelas: kelasSiswa,
                skor: skorAkhir
            };

            fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload)
            }).then(() => {
                // Perbarui leaderboard setelah data masuk
                setTimeout(muatLeaderboard, 1500);
            });
        }
    </script>
</body>
</html>
