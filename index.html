<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"><title>Kuis Bocah Wigati</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background-color: #f4f7f6; max-width: 500px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background-color: #27ae60; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-admin { background-color: #e67e22; }
        .btn-danger { background-color: #c0392b; }
        .hidden { display: none; }
        .option-label { display: block; padding: 12px; margin-bottom: 8px; border: 2px solid #eee; border-radius: 8px; cursor: pointer; }
        .correct { background-color: #d4edda !important; border-color: #28a745 !important; }
        .incorrect { background-color: #f8d7da !important; border-color: #dc3545 !important; }
    </style>
</head>
<body>
    <h1>🎨 Kuis Bocah Wigati</h1>
    <div id="login-section" class="card">
        <select id="pilih-kategori"><option value="">Memuat Kategori...</option></select>
        <input type="text" id="nama" placeholder="Nama Lengkap">
        <input type="text" id="kelas" placeholder="Kelas">
        <button onclick="mulaiKuis()">Mulai Kuis 🚀</button>
        <button class="btn-admin" onclick="bukaLoginAdmin()">🔐 Login Admin</button>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel-section" class="card hidden">
        <h3>Panel Admin</h3>
        <button class="btn-danger" onclick="resetPeringkat()">🗑️ Reset Leaderboard</button>
        <button onclick="kembaliKeHome()">Keluar</button>
    </div>

    <div id="quiz-section" class="hidden"></div>
    <div id="result-section" class="hidden card"><h2>Selesai!</h2><button onclick="location.reload()">Menu Utama</button></div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwCQiAcQz_oGypiruMPdNnpBhcdjPbwADx_jHxBGxi8zFXJhzLzCs2tdyp1CucyNvEF/exec';
        let dataSoal = [], jawabanSiswa = [], indeksSoal = 0, namaSiswa, kelasSiswa, kategoriAktif;

        // Fungsi fetch sederhana
        async function mulaiKuis() {
            kategoriAktif = document.getElementById('pilih-kategori').value;
            namaSiswa = document.getElementById('nama').value;
            kelasSiswa = document.getElementById('kelas').value;
            const res = await fetch(API_URL + `?mode=soal&kategori=${kategoriAktif}`);
            dataSoal = await res.json();
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            tampilkanSoal(0);
        }

        function tampilkanSoal(i) {
            const item = dataSoal[i];
            document.getElementById('quiz-section').innerHTML = `
                <div class="card">
                    <p><strong>${item.pertanyaan}</strong></p>
                    ${['opsi_a','opsi_b','opsi_c','opsi_d'].map(o => `<label class="option-label"><input type="radio" name="p" value="${item[o]}" onclick="cek('${item[o]}','${item.kunci}')"> ${item[o]}</label>`).join('')}
                </div>`;
        }

        function cek(p, k) {
            if(p.toLowerCase().includes(k.toLowerCase())) alert("Benar!");
            jawabanSiswa.push(p);
            indeksSoal++;
            if(indeksSoal < dataSoal.length) tampilkanSoal(indeksSoal);
            else finish();
        }

        function finish() {
            // Logika hitung skor dan kirim ke doPost
            alert("Kuis selesai!");
            location.reload();
        }

        function bukaLoginAdmin() { if(prompt("Password:") === 'admin123') document.getElementById('admin-panel-section').classList.remove('hidden'); }
        function resetPeringkat() { if(confirm("Yakin?")) fetch(API_URL, {method:'POST', mode:'no-cors', body: JSON.stringify({action:'resetLeaderboard'})}); }
        function kembaliKeHome() { location.reload(); }
    </script>
</body>
</html>
