<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Interaktif Wigati</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            padding: 20px; 
            background-color: #f4f7f6; 
            max-width: 500px; 
            margin: auto; 
        }
        h1 { 
            color: #2c3e50; 
            text-align: center; 
        }
        .input-group { 
            background: white; 
            padding: 15px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            margin-bottom: 20px; 
        }
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 10px; 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px;
        }
        .soal-card { 
            background: white; 
            padding: 20px; 
            margin-bottom: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            text-align: left;
        }
        .soal-card img { 
            width: 100%; 
            border-radius: 10px; 
            margin-top: 10px; 
            margin-bottom: 15px; 
            display: block; 
            object-fit: cover;
            max-height: 250px;
        }
        .soal-card label { 
            display: block; 
            margin-bottom: 10px; 
            cursor: pointer; 
            font-size: 15px;
        }
        button { 
            width: 100%; 
            padding: 15px; 
            background-color: #27ae60; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 18px; 
            cursor: pointer; 
            transition: background 0.3s;
            font-weight: bold;
            margin-bottom: 30px;
        }
        button:hover { 
            background-color: #2ecc71; 
        }
        @keyframes fadeIn { 
            from { opacity: 0; } 
            to { opacity: 1; } 
        }
        #app { 
            animation: fadeIn 0.8s ease-in-out; 
        }
    </style>
</head>
<body>
    <h1>🎨 Kuis Interaktif Wigati</h1>
    
    <div class="input-group">
        <input type="text" id="nama" placeholder="Nama Lengkap" required>
        <input type="text" id="kelas" placeholder="Kelas" required>
    </div>

    <div id="app">Memuat soal...</div>
    
    <button onclick="kirimHasil()">🚀 Selesai & Kirim</button>

    <script>
        // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
        const API_URL = 'https://script.google.com/macros/s/AKfycbwCQiAcQz_oGypiruMPdNnpBhcdjPbwADx_jHxBGxi8zFXJhzLzCs2tdyp1CucyNvEF/exec';
        let dataSoal = [];

        // 1. Mengambil data soal dari Apps Script
        fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                dataSoal = data;
                let html = '';
                
                data.forEach((item, index) => {
                    // Cek apakah link gambar tersedia dan tidak kosong
                    let imgTag = '';
                    if (item.gambar && item.gambar.trim() !== '') {
                        imgTag = `<img src="${item.gambar}" alt="Ilustrasi Soal">`;
                    }
                    
                    html += `<div class="soal-card">
                        <p><strong>${item.id}. ${item.pertanyaan}</strong></p>
                        ${imgTag}
                        <label><input type="radio" name="soal${index}" value="${item.opsi_a}"> ${item.opsi_a}</label>
                        <label><input type="radio" name="soal${index}" value="${item.opsi_b}"> ${item.opsi_b}</label>
                        <label><input type="radio" name="soal${index}" value="${item.opsi_c}"> ${item.opsi_c}</label>
                        <label><input type="radio" name="soal${index}" value="${item.opsi_d}"> ${item.opsi_d}</label>
                    </div>`;
                });
                
                document.getElementById('app').innerHTML = html;
            })
            .catch(error => {
                document.getElementById('app').innerHTML = '<p style="text-align:center; color:red;">Gagal memuat soal. Periksa kembali URL API Anda.</p>';
            });

        // 2. Logika Menghitung Skor dan Mengirim Hasil
        function kirimHasil() {
            const nama = document.getElementById('nama').value.trim();
            const kelas = document.getElementById('kelas').value.trim();

            if (!nama || !kelas) {
                alert("Harap isi Nama dan Kelas terlebih dahulu!");
                return;
            }

            let totalBenar = 0;
            const poinPerSoal = 100 / dataSoal.length;

            // Membandingkan jawaban pilihan siswa dengan Kunci Jawaban di Sheets
            dataSoal.forEach((item, index) => {
                const pilihan = document.querySelector(`input[name="soal${index}"]:checked`);
                if (pilihan && pilihan.value.trim() === item.kunci.trim()) {
                    totalBenar++;
                }
            });

            const skorAkhir = totalBenar * poinPerSoal;

            // Mengirim data ke Google Sheets via POST
            const payload = {
                nama: nama,
                kelas: kelas,
                skor: skorAkhir
            };

            fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload)
            }).then(() => {
                alert(`Kuis Selesai!\n\nNama: ${nama}\nKelas: ${kelas}\nSkor Anda: ${skorAkhir}`);
            }).catch(error => {
                alert("Terjadi kesalahan saat mengirim skor.");
            });
        }
    </script>
</body>
</html>
