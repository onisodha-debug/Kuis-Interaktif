<!DOCTYPE html>
<html>
<head>
    <title>Kuis Seni Budaya</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background-color: #f4f7f6; max-width: 500px; margin: auto; }
        .soal-card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        img { width: 100%; border-radius: 10px; margin-top: 10px; margin-bottom: 10px; display: block; }
        button { width: 100%; padding: 15px; background-color: #27ae60; color: white; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>
    <h1>🎨 Kuis Seni Budaya</h1>
    <input type="text" id="nama" placeholder="Nama Lengkap">
    <input type="text" id="kelas" placeholder="Kelas">

    <div id="app">Memuat soal...</div>
    <button onclick="kirimHasil()">🚀 Selesai & Kirim</button>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwCQiAcQz_oGypiruMPdNnpBhcdjPbwADx_jHxBGxi8zFXJhzLzCs2tdyp1CucyNvEF/exec';
        let dataSoal = [];

        fetch(API_URL).then(res => res.json()).then(data => {
            dataSoal = data;
            let html = '';
            data.forEach((item, index) => {
                // Hanya tampilkan gambar jika link tersedia
                let imgTag = item.gambar ? `<img src="${item.gambar}" alt="Ilustrasi Soal">` : '';
                
                html += `<div class="soal-card">
                    <p><strong>${item.id}. ${item.pertanyaan}</strong></p>
                    ${imgTag}
                    <label><input type="radio" name="soal${index}" value="${item.opsi_a}"> ${item.opsi_a}</label><br>
                    <label><input type="radio" name="soal${index}" value="${item.opsi_b}"> ${item.opsi_b}</label><br>
                    <label><input type="radio" name="soal${index}" value="${item.opsi_c}"> ${item.opsi_c}</label><br>
                    <label><input type="radio" name="soal${index}" value="${item.opsi_d}"> ${item.opsi_d}</label>
                </div>`;
            });
            document.getElementById('app').innerHTML = html;
        });

        function kirimHasil() {
            // ... (logika kirimHasil tetap sama)
        }
    </script>
</body>
</html>
