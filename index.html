<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Seni Budaya</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            padding: 20px; 
            background-color: #f4f7f6; 
            max-width: 500px; 
            margin: auto; 
        }
        h1, h3 { 
            color: #2c3e50; 
            text-align: center; 
        }
        .input-group, .soal-card, .leaderboard-card, .selesai-card { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            margin-bottom: 20px; 
        }
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 10px; 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px;
        }
        /* Progress Bar */
        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 12px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #27ae60;
            border-radius: 10px;
            transition: width 0.4s ease;
        }
        .soal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        .timer-box {
            background: #e74c3c;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
        }
        .soal-card img { 
            width: 100%; 
            border-radius: 10px; 
            margin-top: 10px; 
            margin-bottom: 15px; 
            display: block; 
            object-fit: cover;
            max-height: 250px;
        }
        .soal-card label { 
            display: block; 
            padding: 12px;
            margin-bottom: 8px; 
            border: 2px solid #eee;
            border-radius: 8px;
            cursor: pointer; 
            font-size: 15px;
            transition: all 0.2s;
        }
        .soal-card label:hover {
            background-color: #f8f9fa;
            border-color: #cbd5e1;
        }
        /* Umpan Balik Warna */
        .correct {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
            font-weight: bold;
        }
        .incorrect {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }
        button { 
            width: 100%; 
            padding: 15px; 
            background-color: #27ae60; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 18px; 
            cursor: pointer; 
            transition: background 0.3s;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background-color: #2ecc71; }
        .btn-secondary { background-color: #3498db; margin-bottom: 20px; }
        .btn-secondary:hover { background-color: #2980b9; }
        .hidden { display: none; }
        table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 10px; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; }
        th { color: #2c3e50; }
        @keyframes fadeInSlide { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animasi-transisi { animation: fadeInSlide 0.4s ease-in-out; }
    </style>
</head>
<body>
    <h1>🎨 Kuis Seni Budaya</h1>
    
    <!-- Bagian Login -->
    <div id="login-section" class="input-group animasi-transisi">
        <p style="margin-top:0; color:#555; text-align:center;">Masukkan identitas sebelum mulai:</p>
        <input type="text" id="nama" placeholder="Nama Lengkap" required>
        <input type="text" id="kelas" placeholder="Kelas" required>
        <button onclick="mulaiKuis()">Mulai Kuis 🚀</button>
    </div>

    <button id="btn-toggle-leaderboard" class="btn-secondary" onclick="toggleLeaderboard()">🏆 Tampilkan Peringkat</button>

    <!-- Leaderboard -->
    <div id="leaderboard-card" class="leaderboard-card animasi-transisi hidden">
        <h3>🏆 Peringkat Teratas</h3>
        <table>
            <thead><tr><th>Nama</th><th>Kelas</th><th>Skor</th></tr></thead>
            <tbody id="isi-leaderboard"><tr><td colspan="3" style="text-align: center; color: #888;">Memuat peringkat...</td></tr></tbody>
        </table>
    </div>

    <!-- Bagian Kuis -->
    <div id="quiz-section" class="hidden">
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div id="soal-container"></div>
    </div>

    <!-- Bagian Hasil -->
    <div id="result-section" class="hidden selesai-card animasi-transisi" style="text-align: center;">
        <h2>🎉 Kuis Selesai!</h2>
        <p id="hasil-teks" style="font-size: 18px; margin: 20px 0;"></p>
        <button onclick="location.reload()">Ulangi Kuis 🔄</button>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwCQiAcQz_oGypiruMPdNnpBhcdjPbwADx_jHxBGxi8zFXJhzLzCs2tdyp1CucyNvEF/exec';
        let dataSoal = [];
        let indeksSoalAktif = 0;
        let jawabanSiswa = [];
        let namaSiswa = '';
        let kelasSiswa = '';
        let timerInterval;
        let sisaWaktu = 25; // 25 detik per soal

        fetch(API_URL).then(res => res.json()).then(data => { dataSoal = data; });

        function muatLeaderboard() {
            fetch(API_URL + '?mode=leaderboard').then(res => res.json()).then(data => {
                let rows = data.length === 0 ? '<tr><td colspan="3" style="text-align: center; color: #888;">Belum ada data.</td></tr>' : '';
                data.slice(0, 5).forEach(item => {
                    rows += `<tr><td>${item.nama}</td><td>${item.kelas}</td><td><strong>${item.skor}</strong></td></tr>`;
                });
                document.getElementById('isi-leaderboard').innerHTML = rows;
            });
        }
        muatLeaderboard();

        function toggleLeaderboard() {
            const lbCard = document.getElementById('leaderboard-card');
            const btnLb = document.getElementById('btn-toggle-leaderboard');
            if (lbCard.classList.contains('hidden')) {
                lbCard.classList.remove('hidden');
                btnLb.innerHTML = "❌ Sembunyikan Peringkat";
                muatLeaderboard();
            } else {
                lbCard.classList.add('hidden');
                btnLb.innerHTML = "🏆 Tampilkan Peringkat";
            }
        }

        function mulaiKuis() {
            namaSiswa = document.getElementById('nama').value.trim();
            kelasSiswa = document.getElementById('kelas').value.trim();
            if (!namaSiswa || !kelasSiswa) { alert("Harap isi Nama dan Kelas!"); return; }
            if (dataSoal.length === 0) { alert("Soal masih dimuat, tunggu sebentar."); return; }

            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('btn-toggle-leaderboard').classList.add('hidden');
            document.getElementById('leaderboard-card').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            
            tampilkanSoal(indeksSoalAktif);
        }

        function tampilkanSoal(index) {
            clearInterval(timerInterval);
            sisaWaktu = 25; // Reset timer

            // Update Progress Bar
            let persentase = ((index) / dataSoal.length) * 100;
            document.getElementById('progress-bar').style.width = persentase + '%';

            const item = dataSoal[index];
            let imgTag = (item.gambar && item.gambar.trim() !== '') ? `<img src="${item.gambar}" alt="Ilustrasi">` : '';

            let html = `
                <div class="soal-card animasi-transisi">
                    <div class="soal-header">
                        <span>Soal ${index + 1} dari ${dataSoal.length}</span>
                        <span id="timer-box" class="timer-box">⏱️ 25s</span>
                    </div>
                    <p><strong>${item.pertanyaan}</strong></p>
                    ${imgTag}
                    <label><input type="radio" name="pilihan" value="${item.opsi_a}" onclick="pilihJawaban(this, '${item.kunci.trim()}')"> ${item.opsi_a}</label>
                    <label><input type="radio" name="pilihan" value="${item.opsi_b}" onclick="pilihJawaban(this, '${item.kunci.trim()}')"> ${item.opsi_b}</label>
                    <label><input type="radio" name="pilihan" value="${item.opsi_c}" onclick="pilihJawaban(this, '${item.kunci.trim()}')"> ${item.opsi_c}</label>
                    <label><input type="radio" name="pilihan" value="${item.opsi_d}" onclick="pilihJawaban(this, '${item.kunci.trim()}')"> ${item.opsi_d}</label>
                </div>
            `;
            document.getElementById('soal-container').innerHTML = html;
            mulaiTimer();
        }

        function mulaiTimer() {
            const timerBox = document.getElementById('timer-box');
            timerInterval = setInterval(() => {
                sisaWaktu--;
                timerBox.innerHTML = `⏱️ ${sisaWaktu}s`;
                if (sisaWaktu <= 0) {
                    clearInterval(timerInterval);
                    // Jika waktu habis, anggap salah/kosong
                    jawabanSiswa.push("");
                    lanjutKeSoalBerikutnya();
                }
            }, 1000);
        }

        function pilihJawaban(element, kunciJawaban) {
            clearInterval(timerInterval); // Hentikan timer saat dijawab
            
            const pilihanSiswa = element.value.trim();
            jawabanSiswa.push(pilihanSiswa);

            // Berikan Umpan Balik Instan (Warna)
            const labels = document.querySelectorAll('.soal-card label');
            labels.forEach(label => {
                const radio = label.querySelector('input');
                radio.disabled = true; // Kunci semua pilihan
                if (radio.value.trim() === kunciJawaban) {
                    label.classList.add('correct'); // Hijau untuk jawaban benar
                } else if (radio === element && pilihanSiswa !== kunciJawaban) {
                    label.classList.add('incorrect'); // Merah jika pilihan user salah
                }
            });

            // Tunggu 1.5 detik lalu lanjut otomatis
            setTimeout(() => {
                lanjutKeSoalBerikutnya();
            }, 1500);
        }

        function lanjutKeSoalBerikutnya() {
            indeksSoalAktif++;
            if (indeksSoalAktif < dataSoal.length) {
                tampilkanSoal(indeksSoalAktif);
            } else {
                document.getElementById('progress-bar').style.width = '100%';
                hitungDanKirimHasil();
            }
        }

        function hitungDanKirimHasil() {
            let totalBenar = 0;
            const poinPerSoal = 100 / dataSoal.length;

            dataSoal.forEach((item, index) => {
                if (jawabanSiswa[index] === item.kunci.trim()) {
                    totalBenar++;
                }
            });

            const skorAkhir = totalBenar * poinPerSoal;

            document.getElementById('quiz-section').classList.add('hidden');
            const resultSection = document.getElementById('result-section');
            resultSection.classList.remove('hidden');
            document.getElementById('hasil-teks').innerHTML = `Halo <strong>${namaSiswa}</strong> (${kelasSiswa}),<br> Skor akhir Anda adalah: <span style="font-size: 28px; color: #27ae60; font-weight: bold;">${skorAkhir}</span>`;

            fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ nama: namaSiswa, kelas: kelasSiswa, skor: skorAkhir })
            }).then(() => {
                setTimeout(muatLeaderboard, 1500);
            });
        }
    </script>
</body>
</html>
